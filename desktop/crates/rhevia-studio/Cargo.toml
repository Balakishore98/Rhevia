[package]
name = "rhevia-studio"
description = "Rhevia Studio — the live production switcher"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[[bin]]
name = "rhevia-studio"
path = "src/main.rs"

[dependencies]
rhevia-audio = { path = "../rhevia-audio" }
rhevia-capture = { path = "../rhevia-capture" }
rhevia-media = { path = "../rhevia-media" }
rhevia-ndi = { path = "../rhevia-ndi" }
rhevia-plugin = { path = "../rhevia-plugin" }
rhevia-engine = { path = "../rhevia-engine" }
rhevia-output = { path = "../rhevia-output" }
rhevia-pipeline = { path = "../rhevia-pipeline" }
anyhow.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "wgpu"] }
egui = "0.29"
image = { version = "0.25.10", default-features = false, features = ["png"] }

[build-dependencies]
winresource = "0.1.31"
