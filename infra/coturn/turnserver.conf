# coturn configuration for the RheviaLink relay.
#
# TURN is only used when ICE cannot find a direct path between the phone and
# the desktop. That is the minority of connections, but it is the one that
# makes "phone on mobile data, desktop on office Wi-Fi" work at all, so it
# cannot be skipped.
#
# coturn is licensed BSD-3-Clause, so it is safe to deploy and ship around.

listening-port=3478
tls-listening-port=5349

# Replace with the server's public address. Behind NAT (most cloud VMs), set
# both: the private address it binds to and the public address it advertises.
listening-ip=0.0.0.0
# external-ip=<public-ip>/<private-ip>

realm=link.rhevia.app
server-name=link.rhevia.app

# Time-limited credentials, matching mintIceServers() in the signaling server.
# The static secret must be identical in both places and must never be shipped
# inside the mobile app.
use-auth-secret
static-auth-secret=CHANGE_ME_SHARED_WITH_SIGNALING_SERVER

# TLS for the turns: transport, so the relay works on networks that only permit
# 443 outbound. Use the same certificate as the signaling endpoint.
# cert=/etc/letsencrypt/live/link.rhevia.app/fullchain.pem
# pkey=/etc/letsencrypt/live/link.rhevia.app/privkey.pem

fingerprint
no-cli
no-multicast-peers

# A relayed session must not be usable as an open proxy into private networks.
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=127.0.0.0-127.255.255.255

# Relay bandwidth is the main running cost, so cap what one session can consume.
# 2 Mbps in bytes/sec; raise once tiering and billing exist.
max-bps=250000
user-quota=12
total-quota=1200
